plugins { id 'com.android.application' }
android {
    namespace 'cc.fgobond.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cc.fgobond.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Generated by the shared asset builder; includes both regional catalogs.
    sourceSets.main.assets.srcDirs = ['build/site-assets']
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copySite', Copy) { from '../../site'; into 'build/site-assets/site' }
preBuild.dependsOn copySite
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.work:work-runtime:2.10.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
