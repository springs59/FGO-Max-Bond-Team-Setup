name: AI verified lower-bound validation
on:
  push:
    branches: [feat/verified-ai-lower-bound]
    paths: ['src/**/*.js', 'scripts/**', 'package*.json', '.github/workflows/ai-lower-bound.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-lower-bound-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: python3 scripts/test-native-version.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1 fake-indexeddb@6.2.5
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ai-update-ui.mjs
      - run: node scripts/check-team-comparison-ui.mjs
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with: {path: candidate}
      - uses: actions/checkout@v7.0.1
        with:
          ref: 13d8fa7ed273c0f86c2babd9b2b6bc9c78767519
          path: baseline
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - name: Paired cold-query performance and exact optima
        working-directory: candidate
        env:
          FGO_LB_BASELINE: ${{ github.workspace }}/baseline
          FGO_LB_CASES: '64'
          FGO_LB_ROUNDS: '5'
          FGO_LB_OFFSET: '5400000'
          FGO_LB_PUBLIC: '1'
          FGO_LB_OUTPUT: docs/test-results/ai-lower-bound-cloud.json
        run: |
          node scripts/check-ai-lower-bound.mjs
          node scripts/summarize-ai-lower-bound.mjs docs/test-results/ai-lower-bound-cloud.json docs/test-results/ai-lower-bound-cloud-summary.json
      - name: Independent support and position coverage
        working-directory: candidate
        env:
          FGO_LB_BASELINE: ${{ github.workspace }}/baseline
          FGO_LB_CASES: '32'
          FGO_LB_ROUNDS: '3'
          FGO_LB_OFFSET: '5200000'
          FGO_LB_ALTERNATIVES: '1'
          FGO_LB_OUTPUT: docs/test-results/ai-lower-bound-alternatives.json
        run: node scripts/check-ai-lower-bound.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verified-ai-lower-bound-measurements
          path: candidate/docs/test-results/ai-lower-bound-*.json
          retention-days: 90
