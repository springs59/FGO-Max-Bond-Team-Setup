name: 三版本独立测试 APK
on:
  push:
    branches: [test/three-version-209]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparison-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 1}
      - name: Fetch only the two fixed release snapshots
        run: git fetch --no-tags --depth=1 origin 6320a8ffd31c444fbc76a64e14e576f759e1de1c d586ef21952b3b3db7dc5734036899ffed90484d
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: node scripts/build-comparison-apk.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-comparison-apk.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: comparison-browser-checks
          path: ui-checks/comparison
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 1}
      - name: Fetch only the two fixed release snapshots
        run: git fetch --no-tags --depth=1 origin 6320a8ffd31c444fbc76a64e14e576f759e1de1c d586ef21952b3b3db7dc5734036899ffed90484d
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - uses: actions/setup-java@v6.0.1
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with: {gradle-version: '8.11.1'}
      - run: node scripts/build-comparison-apk.mjs
      - name: Build comparison APK and device checks
        working-directory: native/android
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Sign standalone APK
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: bash scripts/sign-android-release.sh native/android/app/build/outputs/apk/release/app-release-unsigned.apk release/FGO-Bond-Three-Versions-2.0.9-test.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify all three versions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/check-comparison-android.sh
      - name: Verify packaged code, frozen data and independent package
        run: python3 scripts/verify-comparison-apk.py release/FGO-Bond-Three-Versions-2.0.9-test.apk
      - run: |
          cp native/site/comparison-manifest.json release/
          cp docs/three-version-test.md release/TESTING.md
          cd release
          sha256sum FGO-Bond-Three-Versions-2.0.9-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: comparison-signed-apk
          path: release/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: comparison-android-results
          path: |
            native/android/app/build/reports
            native/android/app/build/outputs/androidTest-results
  publish-test:
    needs: [checks, android]
    if: github.ref == 'refs/heads/test/three-version-209'
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with: {name: comparison-signed-apk, path: release}
      - name: Publish isolated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="compare-2.0.9-${GITHUB_RUN_ID}"
          gh release create "$tag" release/FGO-Bond-Three-Versions-2.0.9-test.apk release/SHA256SUMS.txt release/comparison-manifest.json release/TESTING.md --target "$GITHUB_SHA" --title '羁绊三版本对比 APK · 2.0.0 / 2.0.8 / 2.0.9' --notes-file docs/three-version-test.md --prerelease --latest=false
