name: CI

on:
  push:
    branches: [main, 'verify/**']
  pull_request:

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate workflow expressions and reusable-workflow inputs
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 "$base/$checksums" -o "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar --no-same-owner -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check installer version increments and retry consistency
        run: python3 scripts/test-native-version.py
      - name: Verify release binary parsers with actual published installers
        run: python3 scripts/verify-native-release.test.py
      - name: Check software update integrity, recovery and upgrade guards
        run: node native/desktop/update-tests.mjs
      - name: Validate snapshot schema
        run: npm run validate-data
      - name: Validate exact curve and factor indexes
        run: node scripts/validate-curve-index.mjs

  workspace-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1 fake-indexeddb@6.2.5
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check navigation, account import and responsive layouts
        run: node scripts/check-workspace-ui.mjs
      - name: Check bond tabs, team differences and live equivalent-member swaps
        run: node scripts/check-team-comparison-ui.mjs
      - name: Check AI choice, independent updates and exact Worker dispatch
        run: node scripts/check-ai-update-ui.mjs
      - name: Check task states, retry controls and responsive layouts
        run: node scripts/check-task-ui.mjs
      - name: Check formation solver, curves and persistent local result reuse
        run: node scripts/check-formation-ui.mjs
      - name: Check 2.1 completed-result cache and zero ordinary-query journals
        run: node scripts/check-query-preview.mjs
      - name: Check recommendation score and cache reuse after worker restart
        run: node scripts/check-recommend-cache.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Workspace-UI-checks
          path: ui-checks
