name: CI

on:
  push:
    branches: [main, 'verify/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Validate snapshot schema
        run: npm run validate-data
      - name: Validate exact curve and factor indexes
        run: node scripts/validate-curve-index.mjs

  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check navigation, account import and responsive layouts
        run: node scripts/check-workspace-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workspace-UI-checks
          path: ui-checks
