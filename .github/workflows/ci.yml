name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Validate snapshot schema
        run: npm run validate-data
      - name: Validate exact curve and factor indexes
        run: node scripts/validate-curve-index.mjs
