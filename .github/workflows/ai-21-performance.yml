name: AI 2.1 real-browser performance
on:
  push:
    branches: ['test/ai-2.1']
    paths: ['scripts/benchmark-ai-21-browser.mjs', '.github/workflows/ai-21-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with: {path: fgo}
      - uses: actions/checkout@v7.0.1
        with: {ref: native-v2.0.0, path: baseline-200}
      - uses: actions/checkout@v7.0.1
        with: {ref: 137ce88f4375443c925dbafbe247adecfab6ea97, path: baseline-209}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1 fake-indexeddb@6.2.5
        working-directory: fgo
      - run: npx playwright install --with-deps chromium
        working-directory: fgo
      - name: Cold, same-Worker, restarted-Worker and changed-condition queries
        working-directory: fgo
        run: node scripts/benchmark-ai-21-browser.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: AI-2.1-real-browser-performance
          path: fgo/docs/test-results/ai-21-browser.json
