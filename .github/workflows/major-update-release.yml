name: 完整更新并发布安装包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/native-release-request.json']

permissions:
  contents: write

concurrency:
  group: major-update-release
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      refresh_data: ${{ steps.request.outputs.refresh_data }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: request
        name: Read explicit data-refresh choice
        run: |
          python3 - <<'PYTHON'
          import json,os
          refresh=json.load(open('.github/native-release-request.json')).get('refresh_data',True)
          if not isinstance(refresh,bool):
              raise SystemExit('refresh_data must be a boolean')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('refresh_data='+str(refresh).lower()+'\n')
          PYTHON
      - name: Check release branch and Android signing configuration
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run the major update workflow on main.'
            exit 1
          fi
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" || -z "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo '::error::Configure ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_PASSWORD in repository Actions secrets before running the major update.'
            exit 1
          fi
  update:
    needs: preflight
    if: needs.preflight.outputs.refresh_data == 'true'
    uses: ./.github/workflows/snapshot-game-data.yml
    with:
      full_refresh: true
  installers:
    needs: [preflight, update]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    uses: ./.github/workflows/native-apps.yml
    with:
      source_ref: ${{ needs.update.outputs.revision || github.sha }}
      publish: true
      release_sequence: ${{ fromJSON(github.run_number) }}
    secrets: inherit
