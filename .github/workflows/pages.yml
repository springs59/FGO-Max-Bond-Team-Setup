name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Snapshot game data"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('pages-ignored-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Validate snapshot schema
        run: npm run validate-data
      - name: Build solver index
        run: npm run build-solver-index
      - name: Validate solver index
        run: npm run validate-solver-index
      - name: Build and validate activity score matrix
        run: |
          node scripts/build-activity-score-index.mjs
          node scripts/validate-activity-score-index.mjs
      - name: Validate exact curve and factor indexes
        run: node scripts/validate-curve-index.mjs
      - name: Run tests
        run: npm test
      - name: Solver benchmark
        run: npm run benchmark
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Stage static site
        run: |
          node scripts/build-activity-score-index.mjs
          mkdir -p dist/src
          cp index.html dist/
          cp glossary.html layout-preview.html dist/
          cp -r src dist/
          node scripts/build-native-assets.mjs --manifest-only
          cp -r generated dist/
          mkdir -p dist/native
          cp -r native/shared native/tasks.html native/tasks.css native/host.html dist/native/
          touch dist/.nojekyll
          GITHUB_SHA=$(git rev-parse HEAD) python3 scripts/stamp-build-time.py dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
