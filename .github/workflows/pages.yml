name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Snapshot game data"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate snapshot schema
        run: npm run validate-data
      - name: Build solver index
        run: npm run build-solver-index
      - name: Validate solver index
        run: npm run validate-solver-index
      - name: Run tests
        run: npm test
      - name: Solver benchmark
        run: npm run benchmark
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Stage static site
        run: |
          mkdir -p dist/src
          cp index.html dist/
          cp glossary.html dist/
          cp -r src dist/
          cp -r generated dist/
          touch dist/.nojekyll
          python3 scripts/stamp-build-time.py dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
