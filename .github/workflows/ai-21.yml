name: AI 2.1 isolated validation
on:
  push:
    branches: ['test/ai-2.1']
    paths: ['src/**/*.js', 'native/**', 'package*.json', 'scripts/**', '.github/workflows/ai-21.yml', '.github/workflows/native-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: python3 scripts/test-native-version.py
      - run: npm run validate-data
      - run: node scripts/validate-curve-index.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1 fake-indexeddb@6.2.5
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-workspace-ui.mjs
      - run: node scripts/check-team-comparison-ui.mjs
      - run: node scripts/check-task-ui.mjs
      - run: node scripts/check-formation-ui.mjs
      - run: node scripts/check-recommend-cache.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: AI-2.1-UI-checks
          path: ui-checks
  installers:
    uses: ./.github/workflows/native-apps.yml
    with:
      source_ref: ${{ github.sha }}
      publish: false
