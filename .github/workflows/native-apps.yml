name: Build desktop and Android apps
on:
  push:
    branches: ['verify/**']
    paths: ['native/**', 'src/**/*.js', 'src/**/*.css', 'index.html', 'scripts/build-native-assets.mjs', 'scripts/sign-android-release.sh', 'docs/native-release.md', '.github/workflows/native-apps.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      release_sequence:
        description: Major-update run number; unchanged when the same run is retried
        type: number
        default: 0
    secrets:
      ANDROID_SIGNING_KEY_BASE64:
        required: false
      ANDROID_SIGNING_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: native-apps-${{ inputs.source_ref || github.ref }}-${{ inputs.publish && 'release' || 'check' }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      android_code: ${{ steps.version.outputs.android_code }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: version
        env:
          RELEASE_SEQUENCE: ${{ inputs.release_sequence || 0 }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [[ "$PUBLISH" == true && "$RELEASE_SEQUENCE" -lt 1 ]]; then
            echo '::error::Publishing requires a major-update release sequence.'
            exit 1
          fi
          python3 scripts/prepare-native-version.py --sequence "$RELEASE_SEQUENCE"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply reserved Windows version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: python scripts/prepare-native-version.py --version "$env:RELEASE_VERSION" --code "$env:ANDROID_VERSION_CODE"
      - run: node scripts/build-native-assets.mjs
      - name: Install pinned desktop dependencies
        working-directory: native/desktop
        run: npm ci
      - name: Validate data update and recovery
        working-directory: native/desktop
        run: npm run test-data
      - name: Verify background task and both bundled catalogs
        working-directory: native/desktop
        shell: pwsh
        run: |
          $env:FGO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\fgo-smoke.json"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content $env:FGO_SMOKE_OUTPUT
      - name: Package Windows installer
        working-directory: native/desktop
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Windows-${{ needs.version.outputs.value }}
          path: native/desktop/release/*.exe
          retention-days: 90
  android:
    needs: version
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply reserved Android version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: python3 scripts/prepare-native-version.py --version "$RELEASE_VERSION" --code "$ANDROID_VERSION_CODE"
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: node scripts/build-native-assets.mjs
      - name: Build Android package
        working-directory: native/android
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify local WebView and foreground background precomputation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native/android && gradle connectedDebugAndroidTest --no-daemon
      - name: Sign and verify installable Android package
        id: sign
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" || -z "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing; neither installer will be published."
            echo 'Configure ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_PASSWORD in repository Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bash scripts/sign-android-release.sh native/android/app/build/outputs/apk/release/app-release-unsigned.apk "release/FGO-Bond-Android-${RELEASE_VERSION}.apk"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: FGO-Bond-Android-${{ needs.version.outputs.value }}
          path: release/*.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Android-unsigned-${{ needs.version.outputs.value }}
          path: native/android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: native/android/app/build/reports/androidTests
  publish-installers:
    if: inputs.publish && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: FGO-Bond-Windows-${{ needs.version.outputs.value }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FGO-Bond-Android-${{ needs.version.outputs.value }}
          path: release
      - name: Publish both verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          SOURCE_SHA: ${{ needs.version.outputs.revision }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="native-v${RELEASE_VERSION}"
          exe="FGO-Bond-Windows-${RELEASE_VERSION}.exe"
          apk="FGO-Bond-Android-${RELEASE_VERSION}.apk"
          test -s "release/$exe"
          test -s "release/$apk"
          (cd release && sha256sum "$exe" "$apk" > SHA256SUMS.txt)
          marker="<!-- native-release-run:${RELEASE_RUN_ID} -->"
          cp docs/native-release.md release/notes.md
          printf '\n版本：%s\n\n源码提交：%s\n\n构建记录：%s/%s/actions/runs/%s\n\n%s\n' "$RELEASE_VERSION" "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_RUN_ID" "$marker" >> release/notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "通关羁绊软件 v${RELEASE_VERSION}" --notes-file release/notes.md --draft
          else
            gh release view "$tag" --json body --jq '.body' > release/existing-notes.md
            if ! grep -Fxq "$marker" release/existing-notes.md; then
              echo "::error::Release $tag belongs to a different run; refusing to overwrite it."
              exit 1
            fi
          fi
          gh release upload "$tag" "release/$exe" "release/$apk" release/SHA256SUMS.txt --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' > release/published-assets.txt
          grep -Fxq "$exe" release/published-assets.txt
          grep -Fxq "$apk" release/published-assets.txt
          grep -Fxq SHA256SUMS.txt release/published-assets.txt
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$tag" --notes-file release/notes.md --draft=false --latest
          else
            gh release edit "$tag" --notes-file release/notes.md
          fi
          echo "Published Windows EXE and signed Android APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
