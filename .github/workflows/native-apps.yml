name: Build desktop and Android apps
on:
  push:
    branches: ['verify/**']
    paths: ['native/**', 'src/**/*.js', 'src/**/*.css', 'index.html', 'scripts/build-native-assets.mjs', 'scripts/sign-android-release.sh', 'docs/native-release.md', '.github/workflows/native-apps.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING_KEY_BASE64:
        required: false
      ANDROID_SIGNING_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: native-apps-${{ inputs.source_ref || github.ref }}-${{ inputs.publish && 'release' || 'check' }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: version
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('native/desktop/package.json').read_text())['version']
          android = re.search(r"versionName\s+'([^']+)'", Path('native/android/app/build.gradle').read_text()).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or version != android:
              raise SystemExit('Windows and Android release versions must match')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'value={version}\n')
              import subprocess
              out.write('revision=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
          PYTHON
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/build-native-assets.mjs
      - name: Install pinned desktop dependencies
        working-directory: native/desktop
        run: npm ci
      - name: Validate data update and recovery
        working-directory: native/desktop
        run: npm run test-data
      - name: Verify background task and both bundled catalogs
        working-directory: native/desktop
        shell: pwsh
        run: |
          $env:FGO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\fgo-smoke.json"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content $env:FGO_SMOKE_OUTPUT
      - name: Package Windows installer
        working-directory: native/desktop
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Windows-${{ needs.version.outputs.value }}
          path: native/desktop/release/*.exe
          retention-days: 90
  android:
    needs: version
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: node scripts/build-native-assets.mjs
      - name: Build Android package
        working-directory: native/android
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify local WebView and foreground background precomputation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native/android && gradle connectedDebugAndroidTest --no-daemon
      - name: Sign and verify installable Android package
        id: sign
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" || -z "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing; neither installer will be published."
            echo 'Configure ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_PASSWORD in repository Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bash scripts/sign-android-release.sh native/android/app/build/outputs/apk/release/app-release-unsigned.apk "release/FGO-Bond-Android-${RELEASE_VERSION}.apk"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: FGO-Bond-Android-${{ needs.version.outputs.value }}
          path: release/*.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Android-unsigned-${{ needs.version.outputs.value }}
          path: native/android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: native/android/app/build/reports/androidTests
  publish-installers:
    if: inputs.publish && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: FGO-Bond-Windows-${{ needs.version.outputs.value }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FGO-Bond-Android-${{ needs.version.outputs.value }}
          path: release
      - name: Publish both verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          SOURCE_SHA: ${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          tag="native-v${RELEASE_VERSION}"
          exe="FGO-Bond-Windows-${RELEASE_VERSION}.exe"
          apk="FGO-Bond-Android-${RELEASE_VERSION}.apk"
          test -s "release/$exe"
          test -s "release/$apk"
          (cd release && sha256sum "$exe" "$apk" > SHA256SUMS.txt)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "通关羁绊软件 v${RELEASE_VERSION}" --notes-file docs/native-release.md
          fi
          gh release upload "$tag" "release/$exe" "release/$apk" release/SHA256SUMS.txt --clobber
          gh release edit "$tag" --notes-file docs/native-release.md
          gh release view "$tag" --json assets --jq '.assets[].name' > release/published-assets.txt
          grep -Fxq "$exe" release/published-assets.txt
          grep -Fxq "$apk" release/published-assets.txt
          echo "Published Windows EXE and signed Android APK: $tag" >> "$GITHUB_STEP_SUMMARY"
