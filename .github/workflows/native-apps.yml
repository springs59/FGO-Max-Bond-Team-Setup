name: Build desktop and Android apps
on:
  push:
    branches: ['verify/**']
    paths: ['native/**', 'src/**/*.js', 'src/**/*.css', 'index.html', 'scripts/build-native-assets.mjs', 'scripts/build-native-update.mjs', 'scripts/check-android-upgrade.sh', 'scripts/check-windows-upgrade.ps1', 'scripts/sign-android-release.sh', 'docs/native-release.md', '.github/workflows/native-apps.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      release_sequence:
        description: Major-update run number; unchanged when the same run is retried
        type: number
        default: 0
    secrets:
      ANDROID_SIGNING_KEY_BASE64:
        required: false
      ANDROID_SIGNING_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: native-apps-${{ inputs.source_ref || github.ref }}-${{ inputs.publish && 'release' || 'check' }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      android_code: ${{ steps.version.outputs.android_code }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: version
        env:
          RELEASE_SEQUENCE: ${{ inputs.release_sequence || 0 }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [[ "$PUBLISH" == true && "$RELEASE_SEQUENCE" -lt 1 ]]; then
            echo '::error::Publishing requires a major-update release sequence.'
            exit 1
          fi
          python3 scripts/prepare-native-version.py --sequence "$RELEASE_SEQUENCE"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - uses: actions/setup-python@v7.0.0
        with: {python-version: '3.12'}
      - name: Apply reserved Windows version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: python scripts/prepare-native-version.py --version "$env:RELEASE_VERSION" --code "$env:ANDROID_VERSION_CODE"
      - run: node scripts/build-native-assets.mjs
      - name: Install pinned desktop dependencies
        working-directory: native/desktop
        run: npm ci
      - name: Validate data update and recovery
        working-directory: native/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test-data
      - name: Validate software update and interrupted download recovery
        run: node native/desktop/update-tests.mjs
      - name: Validate real Electron redirects, downloads and resume
        working-directory: native/desktop
        run: npx electron update-electron-tests.cjs
      - name: Verify background task and both bundled catalogs
        working-directory: native/desktop
        shell: pwsh
        run: |
          $env:FGO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\fgo-smoke.json"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content $env:FGO_SMOKE_OUTPUT
      - name: Package Windows installer
        working-directory: native/desktop
        run: npm run pack
      - name: Verify installed app, in-place update and persistent local indexes
        shell: pwsh
        run: ./scripts/check-windows-upgrade.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FGO-Bond-Windows-${{ needs.version.outputs.value }}
          path: native/desktop/release/*.exe
          retention-days: 90
          overwrite: true
  android:
    needs: version
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '22'}
      - name: Apply reserved Android version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: python3 scripts/prepare-native-version.py --version "$RELEASE_VERSION" --code "$ANDROID_VERSION_CODE"
      - uses: actions/setup-java@v6.0.1
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with: {gradle-version: '8.11.1'}
      - run: node scripts/build-native-assets.mjs
      - name: Build a newer same-signature APK for upgrade validation
        working-directory: native/android
        run: |
          gradle assembleDebug -PupdateFixture=true --no-daemon
          mkdir -p app/src/androidTest/assets
          cp app/build/outputs/apk/debug/app-debug.apk app/src/androidTest/assets/upgrade-fixture.apk
      - name: Build Android package
        working-directory: native/android
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify local WebView and foreground background precomputation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/check-android-runtime.sh
      - name: Sign and verify installable Android package
        id: sign
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" || -z "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing; neither installer will be published."
            echo 'Configure ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_PASSWORD in repository Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bash scripts/sign-android-release.sh native/android/app/build/outputs/apk/release/app-release-unsigned.apk "release/FGO-Bond-Android-${RELEASE_VERSION}.apk"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.sign.outputs.signed == 'true'
        with:
          name: FGO-Bond-Android-${{ needs.version.outputs.value }}
          path: release/*.apk
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FGO-Bond-Android-unsigned-${{ needs.version.outputs.value }}
          path: native/android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android-test-results-${{ github.run_attempt }}
          path: |
            native/android/app/build/reports/androidTests
            native/android/app/build/reports/android-runtime
