name: Build desktop and Android apps
on:
  push:
    branches: [main]
    paths: ['native/**', 'src/**/*.js', 'index.html', 'scripts/build-native-assets.mjs', '.github/workflows/native-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-apps
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/build-native-assets.mjs
      - name: Install pinned desktop dependencies
        working-directory: native/desktop
        run: npm ci
      - name: Validate data update and recovery
        working-directory: native/desktop
        run: npm run test-data
      - name: Verify background task and both bundled catalogs
        working-directory: native/desktop
        shell: pwsh
        run: |
          $env:FGO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\fgo-smoke.json"
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content $env:FGO_SMOKE_OUTPUT
      - name: Package Windows installer
        working-directory: native/desktop
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Windows-0.1.0
          path: native/desktop/release/*.exe
          retention-days: 90
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: node scripts/build-native-assets.mjs
      - name: Build Android package
        working-directory: native/android
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify local WebView and foreground background precomputation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native/android && gradle connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Bond-Android-unsigned-0.1.0
          path: native/android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: native/android/app/build/reports/androidTests
  publish-windows:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: FGO-Bond-Windows-0.1.0, path: release}
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view native-v0.1.0 >/dev/null 2>&1; then
            gh release create native-v0.1.0 --target "$GITHUB_SHA" --title "通关羁绊软件 v0.1.0" --notes-file docs/native-release.md
          fi
          gh release upload native-v0.1.0 release/*.exe --clobber
